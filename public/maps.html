<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карты — AETHER</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo">AETHER</a>
    <nav>
      <a href="/">Главная</a>
      <a href="/teams.html">Команды</a>
      <a href="/maps.html" class="active">Карты</a>
      <a href="/admin.html">Админка</a>
      <a href="/login.html">Войти</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Маппул Турнира</h1>
      <p>Карты для проведения матчей</p>
    </div>

    <div style="margin-bottom: 2rem;">
      <form action="/api/maps" method="POST" class="card" style="margin-bottom: 2rem;">
        <h3>Добавить карту</h3>
        <br>
        <div class="form-group">
          <label>Название карты</label>
          <input type="text" name="name" required placeholder="Например: Dust II">
        </div>
        <div class="form-group">
          <label>Ссылка на картинку (URL)</label>
          <input type="text" name="image_url" placeholder="https://example.com/image.jpg">
        </div>
        <button type="submit" class="btn">Добавить карту</button>
      </form>
    </div>

    <div id="mapsList" class="grid">
      <p class="empty-msg">Загрузка карт...</p>
    </div>
  </div>

  <script>
    async function loadMaps() {
      const container = document.getElementById('mapsList');
      try {
        const res = await fetch('/api/maps');
        const maps = await res.json();

        if (!maps || maps.length === 0) {
          container.innerHTML = '<p class="empty-msg">Карты еще не добавлены.</p>';
          return;
        }

        container.innerHTML = maps.map(map => `
          <div class="card">
            <h3>${map.name}</h3>
            ${map.image_url ? `<img src="${map.image_url}" alt="${map.name}" style="width:100%; border-radius:4px; margin-top:0.5rem;">` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="empty-msg">Ошибка при загрузке карт.</p>';
      }
    }

    loadMaps();
  </script>
</body>
</html>
