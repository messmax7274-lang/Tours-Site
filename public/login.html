<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — AETHER</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo">AETHER</a>
    <nav>
      <a href="/">Главная</a>
      <a href="/teams.html">Команды</a>
      <a href="/maps.html">Карты</a>
      <a href="/admin.html">Админка</a>
      <a href="/login.html" class="active">Войти</a>
    </nav>
  </header>

  <div class="container" style="max-width: 450px;">
    <div class="hero">
      <h1>Авторизация</h1>
      <p>Зайдите в свою учетную запись</p>
    </div>

    <form action="/api/login" method="POST" class="card">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" required placeholder="Введите логин">
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="Введите пароль">
      </div>

      <div class="form-group">
        <label>Роль</label>
        <select name="role">
          <option value="viewer">Зритель</option>
          <option value="captain">Капитан команды</option>
          <option value="admin">Администратор</option>
        </select>
      </div>

      <button type="submit" class="btn">Войти</button>
    </form>
  </div>

</body>
</html>
