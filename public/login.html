<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CYBERGRID - Вход</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="bg-slate-800 border border-slate-700 rounded-xl p-8 w-full max-w-md shadow-2xl">
    <a href="/" class="text-xs text-slate-400 hover:text-cyan-400 mb-4 inline-block">&larr; На главную</a>
    <h2 class="text-2xl font-bold mb-6 text-cyan-300">Авторизация</h2>
    
    <form action="/api/login" method="POST" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Логин</label>
        <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Пароль</label>
        <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>
      <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition mt-2">
        Войти
      </button>
    </form>
  </div>

</body>
</html>
