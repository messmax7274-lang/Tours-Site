<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER — Главная</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="globalAnnouncement">
    <span id="announcementText">🔴 ТУРНИР НАЧАЛСЯ!</span>
    <a id="announcementLink" href="#" target="_blank">Смотреть на Twitch 🎬</a>
  </div>

  <header>
    <a href="/" class="logo">AETHER</a>
    <nav id="navMenu">
      <a href="/" class="active">Главная</a>
      <a href="/teams.html">Команды</a>
      <a href="/maps.html">Карты</a>
      <a href="/login.html">Войти</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Турнирная Платформа AETHER</h1>
      <p>Активные киберспортивные турниры и онлайн сетки</p>
    </div>

    <!-- ПОИСК И ФИЛЬТРАЦИЯ -->
    <div style="background:#1f2833; padding:15px; border-radius:8px; border:1px solid #45a29e; margin-bottom:2rem; display:flex; gap:15px; flex-wrap:wrap;">
      <input type="text" id="searchInput" oninput="filterTournaments()" placeholder="🔍 Поиск турнира по названию..." style="flex:2; min-width:200px; padding:8px; background:#0b0c10; border:1px solid #45a29e; color:#fff;">
      
      <select id="statusFilter" onchange="filterTournaments()" style="flex:1; min-width:150px; padding:8px; background:#0b0c10; border:1px solid #45a29e; color:#fff;">
        <option value="all">Все статусы</option>
        <option value="active">🔴 Идут сейчас (LIVE)</option>
        <option value="pending">⏳ В ожидании</option>
        <option value="finished">🏁 Завершённые</option>
      </select>
    </div>

    <h2>🏆 Список Турниров</h2>
    <br>

    <div id="tournamentsView" class="grid">
      <p class="empty-msg">Загрузка турниров...</p>
    </div>
  </div>

  <script>
    let allTournaments = [];

    async function checkAnnouncement() {
      try {
        const res = await fetch('/api/announcement');
        const data = await res.json();
        if (data) {
          const banner = document.getElementById('globalAnnouncement');
          document.getElementById('announcementText').innerText = `🚨 ТУРНИР "${data.tournamentName.toUpperCase()}" НАЧАЛСЯ!`;
          document.getElementById('announcementLink').href = data.twitchUrl;
          banner.style.display = 'flex';
        }
      } catch (e) {}
    }

    function renderTournaments(tournaments) {
      const container = document.getElementById('tournamentsView');
      if (!tournaments || tournaments.length === 0) {
        container.innerHTML = '<p class="empty-msg">Турниров не найдено.</p>';
        return;
      }

      container.innerHTML = tournaments.map(t => {
        let statusBadge = '⏳ В ожидании';
        let statusColor = '#66fcf1';
        if (t.status === 'active') { statusBadge = '🔴 LIVE'; statusColor = '#ff4655'; }
        if (t.status === 'finished') { statusBadge = '🏁 Завершён'; statusColor = '#888'; }

        return `
          <div class="card" style="grid-column: 1 / -1;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
              <div>
                <h3>${t.name} <span style="font-size:0.85rem; color:#45a29e;">[${t.game}]</span></h3>
                <p>Призовой фонд: <strong>${t.prize_pool}</strong> | Формат: <strong>${t.format}</strong></p>
                <p>Старт: <strong>${new Date(t.start_time).toLocaleString('ru')}</strong></p>
                <p>Статус: <span style="color:${statusColor}; font-weight:bold;">${statusBadge}</span></p>
              </div>
              <a href="${t.twitch_url}" target="_blank" class="btn" style="width:auto; background:#9146ff; color:#fff;">Трансляция Twitch 📺</a>
            </div>

            <hr style="border-color:#45a29e; margin: 1rem 0;">

            <h4>Турнирная Сетка</h4>
            <div class="bracket">
              <div class="bracket-round">
                <h4>Раунд 1</h4>
                ${t.matches.map(m => `
                  <div class="match-box">
                    <div class="match-team" style="${m.winner === m.team1 ? 'color:#66fcf1; font-weight:bold;' : ''}">
                      <span>${m.team1}</span> <span>${m.score1}</span>
                    </div>
                    <div style="border-bottom: 1px solid #333;"></div>
                    <div class="match-team" style="${m.winner === m.team2 ? 'color:#66fcf1; font-weight:bold;' : ''}">
                      <span>${m.team2}</span> <span>${m.score2}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterTournaments() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const filtered = allTournaments.filter(t => {
        const matchesSearch = t.name.toLowerCase().includes(search) || t.game.toLowerCase().includes(search);
        const matchesStatus = status === 'all' || t.status === status;
        return matchesSearch && matchesStatus;
      });

      renderTournaments(filtered);
    }

    async function init() {
      checkAnnouncement();

      try {
        const res = await fetch('/api/me');
        const user = await res.json();
        const nav = document.getElementById('navMenu');

        if (user) {
          let adminLink = user.role === 'admin' ? '<a href="/admin.html">Админка</a>' : '';
          nav.innerHTML = `
            <a href="/" class="active">Главная</a>
            <a href="/teams.html">Команды</a>
            <a href="/maps.html">Карты</a>
            ${adminLink}
            <span style="color:#66fcf1; margin-left:1rem;">[${user.username}]</span>
            <a href="/api/logout" style="color:#ff4655;">Выйти</a>
          `;
        }
      } catch (e) {}

      try {
        const res = await fetch('/api/tournaments');
        allTournaments = await res.json();
        renderTournaments(allTournaments);
      } catch (e) {}
    }

    init();
  </script>
</body>
</html>
