<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — AETHER</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo">AETHER</a>
    <nav id="navMenu">
      <a href="/">Главная</a>
      <a href="/teams.html">Команды</a>
      <a href="/maps.html">Карты</a>
      <a href="/admin.html" class="active">Админка</a>
      <a href="/login.html">Войти</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Панель Администратора</h1>
      <p>Управление турнирами</p>
    </div>

    <div style="margin-bottom: 2rem;">
      <form action="/api/tournaments" method="POST" class="card">
        <h3>Создать новый турнир</h3>
        <br>
        <div class="form-group">
          <label>Название турнира</label>
          <input type="text" name="name" required placeholder="Например: AETHER Summer Cup">
        </div>
        <div class="form-group">
          <label>Количество команд</label>
          <input type="number" name="team_count" required value="8">
        </div>
        <button type="submit" class="btn">Создать турнир</button>
      </form>
    </div>

    <h2>Активные турниры</h2>
    <br>
    <div id="tournamentsList" class="grid">
      <p class="empty-msg">Загрузка турниров...</p>
    </div>
  </div>

  <script>
    async function init() {
      const nav = document.getElementById('navMenu');

      try {
        const resUser = await fetch('/api/me');
        const user = await resUser.json();

        if (!user || user.role !== 'admin') {
          window.location.href = '/login.html';
          return;
        }

        nav.innerHTML = `
          <a href="/">Главная</a>
          <a href="/teams.html">Команды</a>
          <a href="/maps.html">Карты</a>
          <a href="/admin.html" class="active">Админка</a>
          <span style="color:#66fcf1; margin-left:1rem;">[${user.username}]</span>
          <a href="/api/logout" style="color:#ff4655;">Выйти</a>
        `;
      } catch (e) {
        window.location.href = '/login.html';
        return;
      }

      const container = document.getElementById('tournamentsList');
      try {
        const res = await fetch('/api/tournaments');
        const tournaments = await res.json();

        if (!tournaments || tournaments.length === 0) {
          container.innerHTML = '<p class="empty-msg">Турниров пока нет.</p>';
          return;
        }

        container.innerHTML = tournaments.map(t => `
          <div class="card">
            <h3>${t.name}</h3>
            <p>Команд в турнире: <strong>${t.team_count}</strong></p>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="empty-msg">Ошибка при загрузке турниров.</p>';
      }
    }

    init();
  </script>
</body>
</html>
