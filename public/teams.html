<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Команды</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0e12;
      color: #e1e1e6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid #282a36;
    }
    h1, h2 {
      color: #fff;
    }
    a {
      color: #50fa7b;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .card {
      background: #181920;
      border: 1px solid #282a36;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #a9a9b3;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      background: #0d0e12;
      border: 1px solid #282a36;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #bd93f9;
    }
    button {
      background: #bd93f9;
      color: #0d0e12;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #ff79c6;
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .team-card {
      background: #181920;
      border: 1px solid #282a36;
      border-radius: 8px;
      padding: 15px;
    }
    .team-title {
      font-size: 18px;
      font-weight: bold;
      color: #50fa7b;
      margin-bottom: 8px;
    }
    .team-info {
      font-size: 14px;
      color: #a9a9b3;
      margin-bottom: 6px;
    }
    .team-members {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #282a36;
      font-size: 13px;
      color: #f1fa8c;
      white-space: pre-wrap;
    }
    #auth-warning {
      display: none;
      color: #ff5555;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Команды</h1>
      <nav>
        <a href="/">На главную</a> | 
        <a href="/admin.html">Админка</a>
      </nav>
    </header>

    <!-- Форма добавления команды -->
    <div class="card" id="add-team-card">
      <h2>Зарегистрировать команду</h2>
      <br>
      <form action="/api/teams" method="POST" id="team-form">
        <div class="form-group">
          <label for="name">Название команды *</label>
          <input type="text" id="name" name="name" required placeholder="Например: NAVI">
        </div>
        
        <div class="form-group">
          <label for="captain_name">Имя капитана</label>
          <input type="text" id="captain_name" name="captain_name" placeholder="Оставьте пустым, чтобы использовать ваш ник">
        </div>

        <div class="form-group">
          <label for="members">Состав / Участники команды</label>
          <textarea id="members" name="members" placeholder="Перечислите игроков (например: s1mple, b1t, electronic, Perfecto, SDY)"></textarea>
        </div>

        <button type="submit">Создать команду</button>
      </form>
      <div id="auth-warning">Регистрация команд доступна только капитанам или администраторам. Авторизуйтесь под нужной ролью.</div>
    </div>

    <!-- Список зарегистрированных команд -->
    <h2>Список команд</h2>
    <br>
    <div class="teams-grid" id="teams-list">
      <p>Загрузка команд...</p>
    </div>
  </div>

  <script>
    // Проверка текущего пользователя и загрузка команд
    async function init() {
      try {
        const userRes = await fetch('/api/me');
        const user = await userRes.json();

        // Если не авторизован или роль не captain/admin — скрываем форму
        if (!user || (user.role !== 'captain' && user.role !== 'admin')) {
          document.getElementById('team-form').style.display = 'none';
          document.getElementById('auth-warning').style.display = 'block';
        }

        // Загружаем список команд
        const teamsRes = await fetch('/api/teams');
        const teams = await teamsRes.json();

        const container = document.getElementById('teams-list');
        if (teams.length === 0) {
          container.innerHTML = '<p>Пока нет ни одной команды.</p>';
          return;
        }

        container.innerHTML = teams.map(team => `
          <div class="team-card">
            <div class="team-title">${escapeHtml(team.name)}</div>
            <div class="team-info">👑 Капитан: <strong>${escapeHtml(team.captain_name || 'Не указан')}</strong></div>
            ${team.members ? `
              <div class="team-members">
                <strong>Состав:</strong><br>${escapeHtml(team.members)}
              </div>
            ` : ''}
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        document.getElementById('teams-list').innerHTML = '<p>Ошибка при загрузке команд.</p>';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    init();
  </script>
</body>
</html>
