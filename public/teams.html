<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Команды — AETHER</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo">AETHER</a>
    <nav id="navMenu">
      <a href="/">Главная</a>
      <a href="/teams.html" class="active">Команды</a>
      <a href="/maps.html">Карты</a>
      <a href="/login.html">Войти</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Зарегистрированные Команды</h1>
      <p>Список участников турнира</p>
    </div>

    <div id="addTeamBox" style="margin-bottom: 2rem; display: none;">
      <form action="/api/teams" method="POST" class="card">
        <h3>Регистрация команды</h3>
        <br>
        <div class="form-group">
          <label>Название команды</label>
          <input type="text" name="name" required placeholder="Например: NAVI">
        </div>
        <div class="form-group">
          <label>Тег команды</label>
          <input type="text" name="tag" required placeholder="Например: NAVI">
        </div>
        <div class="form-group">
          <label>Имя капитана</label>
          <input type="text" name="captain_name" placeholder="Имя капитана">
        </div>
        <button type="submit" class="btn">Добавить команду</button>
      </form>
    </div>

    <div id="teamsList" class="grid">
      <p class="empty-msg">Загрузка команд...</p>
    </div>
  </div>

  <script>
    async function init() {
      const nav = document.getElementById('navMenu');
      const addTeamBox = document.getElementById('addTeamBox');

      try {
        const resUser = await fetch('/api/me');
        const user = await resUser.json();

        if (user) {
          addTeamBox.style.display = 'block';
          let adminLink = user.role === 'admin' ? '<a href="/admin.html">Админка</a>' : '';
          nav.innerHTML = `
            <a href="/">Главная</a>
            <a href="/teams.html" class="active">Команды</a>
            <a href="/maps.html">Карты</a>
            ${adminLink}
            <span style="color:#66fcf1; margin-left:1rem;">[${user.username}]</span>
            <a href="/api/logout" style="color:#ff4655;">Выйти</a>
          `;
        }
      } catch (e) {}

      const container = document.getElementById('teamsList');
      try {
        const res = await fetch('/api/teams');
        const teams = await res.json();

        if (!teams || teams.length === 0) {
          container.innerHTML = '<p class="empty-msg">Команд пока нет.</p>';
          return;
        }

        container.innerHTML = teams.map(team => `
          <div class="card">
            <h3>[${team.tag}] ${team.name}</h3>
            <p>Капитан: <strong>${team.captain_name || 'Не указан'}</strong></p>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="empty-msg">Ошибка при загрузке команд.</p>';
      }
    }

    init();
  </script>
</body>
</html>
