<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Команды — AETHER</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <div class="logo">AETHER</div>
    <nav>
      <a href="/">Главная</a>
      <a href="/teams.html" class="active">Команды</a>
      <a href="/maps.html">Карты</a>
      <a href="/login.html">Войти</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Зарегистрированные Команды</h1>
      <p>Список команд, готовых к турниру</p>
    </div>

    <div id="teamsList" class="grid">
      <p class="empty-msg">Загрузка команд...</p>
    </div>
  </div>

  <script>
    async function loadTeams() {
      const container = document.getElementById('teamsList');
      try {
        const res = await fetch('/api/teams');
        const teams = await res.json();

        if (!teams || teams.length === 0) {
          container.innerHTML = '<p class="empty-msg">Команд пока нет. Зарегистрируйте первую через панель!</p>';
          return;
        }

        container.innerHTML = teams.map(team => `
          <div class="card">
            <h3>[${team.tag}] ${team.name}</h3>
            <p>Капитан: <strong>${team.captain_name || 'Не указан'}</strong></p>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="empty-msg">Ошибка при загрузке команд.</p>';
      }
    }

    loadTeams();
  </script>
</body>
</html>
