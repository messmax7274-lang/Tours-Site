<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERGRID - Команды</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col p-6">

  <header class="max-w-6xl w-full mx-auto flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-800">
    <a href="/" class="text-3xl font-extrabold tracking-wider text-cyan-400">CYBERGRID</a>
    <a href="/login.html" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition">
      Войти
    </a>
  </header>

  <nav class="max-w-6xl w-full mx-auto my-6 flex gap-6 border-b border-slate-800 text-sm font-medium pb-2">
    <a href="/" class="text-slate-400 hover:text-slate-200">Сетка Турнира</a>
    <a href="/teams.html" class="text-cyan-400 font-bold border-b-2 border-cyan-400 pb-2">Команды</a>
    <a href="/maps.html" class="text-slate-400 hover:text-slate-200">Карты</a>
    <a href="/admin.html" class="text-slate-400 hover:text-slate-200">Панель Управления</a>
  </nav>

  <main class="max-w-6xl w-full mx-auto flex-1">
    <!-- Форма создания команды (доступна капитанам/админам) -->
    <section class="bg-slate-800 border border-slate-700/60 rounded-xl p-5 mb-8">
      <h2 class="text-lg font-bold mb-4 text-cyan-300">Создать команду (Капитан)</h2>
      <form action="/api/teams" method="POST" class="flex flex-col sm:flex-row gap-3">
        <input type="text" name="name" placeholder="Название команды" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm flex-1">
        <input type="text" name="tag" placeholder="Тег (например, NV)" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm w-32">
        <input type="text" name="captain_name" placeholder="Имя капитана" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm flex-1">
        <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm shrink-0">Создать</button>
      </form>
    </section>

    <h2 class="text-xl font-bold mb-4 text-slate-200">Зарегистрированные Команды</h2>
    <div id="teamsList" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4">
        <h3 class="font-bold text-cyan-400 text-lg">[NAV] Team Alpha</h3>
        <p class="text-xs text-slate-400 mt-1">Капитан: Player1</p>
      </div>
    </div>
  </main>

</body>
</html>
